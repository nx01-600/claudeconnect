[package]
name = "claudeconnect"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Peer-to-peer rooms for Claude Code sessions across machines, built on iroh"
repository = "https://github.com/nx01-600/claudeconnect"

[dependencies]
anyhow = "1.0.104"
data-encoding = "2.11.1"
iroh = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
