name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: claudeconnect-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: claudeconnect-macos-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            asset: claudeconnect-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: claudeconnect-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --release --target ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          src=target/${{ matrix.target }}/release/claudeconnect
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "${{ matrix.asset }}"
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" "${{ matrix.asset }}" --clobber
